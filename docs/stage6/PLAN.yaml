      "required_evidence": ["official_or_authorized_generator", "immutable_raw_hash_and_provenance", "unchanged_safety_gates", "ROM_runtime_walkaround"],
      "pass_conditions": ["real_generated_asset_reaches_ROM", "topology_and_budget_contracts_pass", "landmark_is_recognizable_and_coherent", "license_and_cost_recorded"],
      "fail_conditions": ["hand_authored_substitute_only", "unofficial_or_bypassed_access", "threshold_cheating", "no_executable_authorized_route"],

      "required_evidence": ["symbolic_resource_manifest", "format_validators", "deterministic_outputs", "ROM_rendered_resource_proof"],
      "pass_conditions": ["multiple_distinct_resources_compile", "budget_failures_actionable", "resources_render_in_ROM", "no_repetitive_GUI_conversion_required"],
      "fail_conditions": ["binary_only_unrendered_proof", "resource_generation_nondeterministic", "retail_resources_overwritten_unsafely"],

      "commit_rule": "Commit and push variant tooling, catalog, tests, state, and documentation.",
      "next_stage_rule": {"on_pass": "6K", "on_isolated_debt": "6K", "on_blocking_failure": "stop"},
      "human_review_rule": "none"

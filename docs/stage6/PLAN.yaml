    "classifications": [
      "LOCAL_FIXABLE_LATER",
      "ISOLATED_DEFERABLE",
      "DOWNSTREAM_BLOCKING",
      "EXTERNAL_ACCESS_REQUIRED",
      "LEGAL_OR_LICENSE_REQUIRED",
      "DESTRUCTIVE_HIGH_RISK_DECISION"

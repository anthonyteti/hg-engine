      "name": "Visual Direction and Presentation Bible",
      "objective": "Select one coherent DS-native visual direction autonomously and encode it as a reusable presentation contract.",
      "dependencies": ["STAGE_5_COMPLETE"],
      "required_evidence": ["three_distinct_visual_boards", "weighted_decision_matrix", "adversarial_review", "presentation_bible"],
      "pass_conditions": ["exactly_one_direction_selected", "visuals_cover_ui_and_world", "native_resolution_rules_defined", "no_creative_contradiction_blocks_implementation"],
      "fail_conditions": ["fewer_than_three_viable_directions", "selection_not_DS_feasible", "presentation_contract_incomplete"],
      "commit_rule": "Commit and push all validated 6A sources, boards, tests, state, and documentation with explicit staging.",
      "next_stage_rule": {"on_pass": "6B", "on_isolated_debt": "6B", "on_blocking_failure": "stop"},
      "human_review_rule": "AUTONOMOUS_CODEX_SELECTION; no user interruption."
    },
    {
      "id": "6B",
      "name": "Complete UI Reality Audit",
      "objective": "Map ownership, resources, code, input, bindings, budgets, and modification strategy for important player-facing HGSS/HG-Engine UI.",
